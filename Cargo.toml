[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
aibrowse-cdp = { path = "crates/cdp" }
aibrowse-browser = { path = "crates/browser" }
aibrowse-input = { path = "crates/input" }
aibrowse-perception = { path = "crates/perception" }
aibrowse-handoff = { path = "crates/handoff" }
aibrowse-navigator = { path = "crates/navigator" }
aibrowse-network = { path = "crates/network" }
aibrowse-frontdoor = { path = "crates/frontdoor" }

ab_glyph = "0.2"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
chromiumoxide_cdp = "0.9"
chromiumoxide_types = "0.9"
command-fds = { version = "0.3", features = ["tokio"] }
dirs = "7"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rand = "0.10"
rand_distr = "0.6"
flate2 = "1.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }
rmcp = { version = "3.5", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "macros", "schemars"] }
rusqlite = { version = "0.40", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
pdf-extract = "0.12"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
tempfile = "3"
insta = { version = "1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Full debug info made a debug build of this workspace 12-15 GB; line tables keep
# backtraces readable at a fraction of that.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
