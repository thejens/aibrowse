<!doctype html>
<html lang="sv">
<head><meta charset="utf-8"><title>Återkallelser</title></head>
<body>
<main>
  <h1>Återkallelser</h1>
  <ul>
    <li><a href="/notice/481">Salmonella i fryst kyckling, återkallad 14 oktober 2026</a></li>
    <li><a href="/notice/480">Listeria i ost, återkallad 9 oktober 2026</a></li>
    <!-- A category: one number in the query, but no page number pages through it. -->
    <li><a href="?kategori=3">Kött</a></li>
  </ul>
  <!-- Paging named by nothing but its numbers. -->
  <div class="paging"><a href="?sida=2">2</a> <a href="?sida=3">3</a> <a href="?sida=2">Nästa sida ›</a></div>
  <!-- Paging named a pager by its class. -->
  <nav class="c-pagination"><a href="?offset=older">Äldre</a></nav>
  <a rel="next" href="/arkiv/sida-tva">Fler</a>
</main>
</body>
</html>
